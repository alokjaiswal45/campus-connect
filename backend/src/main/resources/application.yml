# Non-secret defaults. Supply DB, mail and bootstrap credentials using environment variables
# or an untracked application.properties file.
spring:
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
